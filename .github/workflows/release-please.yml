name: Release Please

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-please

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}

    permissions:
      contents: write # Pushes to the repo and creates release.
      pull-requests: write # Opens PR.

    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  release-pypi:
    name: Release to PyPI
    uses: ./.github/workflows/pypi-release.yml

    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'

    permissions:
      contents: read
      id-token: write # Publishes to PyPI.
